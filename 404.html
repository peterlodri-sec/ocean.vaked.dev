<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · the constellation</title>
<style>
  :root{--bg:#04060a;--ink:#e7e2f7;--dim:#9a93b8;--accent:#62e6c9;--mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
  .star{font-size:3.5rem;color:var(--accent);margin-bottom:1.25rem;line-height:1}
  h1{font-size:1.25rem;letter-spacing:.12em;margin-bottom:.6rem;font-weight:600}
  p{color:var(--dim);font-size:.85rem;line-height:1.7;margin-bottom:2rem}
  a{color:var(--accent);text-decoration:none;border:1px solid rgba(98,230,201,.35);padding:.55rem 1.2rem;border-radius:9999px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;transition:all .2s ease}
  a:hover{background:rgba(98,230,201,.12);box-shadow:0 0 20px rgba(98,230,201,.2)}
</style>
</head>
<body>
  <div class="star">✦</div>
  <h1>404 · node not found</h1>
  <p>this coordinate has drifted out of the constellation.</p>
  <a href="/">return home</a>
</body>
</html>
